# Global values (can be overridden by parent chart)
global:
  namespace: observability

image:
  repository: prom/node-exporter
  tag: v1.3.1
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 9100

resources:
  limits:
    cpu: 300m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 32Mi

hostNetwork: true
hostPID: true

securityContext:
  runAsNonRoot: true
  runAsUser: 65534
  fsGroup: 65534

# Node selector and tolerations
nodeSelector: {}
tolerations: []

# Annotations for pods
podAnnotations: {}