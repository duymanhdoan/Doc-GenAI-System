# Loop-Based Umbrella Chart Values for Monitoring Stack
# Each component can be enabled/disabled and configured independently

# Global configuration passed to all components
global:
  # Default namespaces
  observabilityNamespace: observability
  tracingNamespace: tracing
  loggingNamespace: logging
  
  # External host configuration
  externalHost: "34.142.154.84.nip.io"
  protocol: "http"
  
  # Common labels applied to all resources
  commonLabels:
    app.kubernetes.io/part-of: monitoring-stack
    app.kubernetes.io/managed-by: helm
  
  # Image pull policy for all components
  imagePullPolicy: IfNotPresent
  
  # Admin credentials for all services
  adminCredentials:
    user: admin
    password: admin
  
  # SMTP configuration for alerts
  smtp:
    smarthost: "localhost:587"
    from: "alertmanager@monitoring.local"
  
  # Service URLs for internal communication
  services:
    prometheus: "prometheus:9090"
    grafana: "grafana:3000"
    alertmanager: "alertmanager:9093"
    jaeger: "jaeger:16686"
    elasticsearch: "elasticsearch:9200"
    kibana: "kibana:5601"

# Namespace creation (umbrella chart responsibility)
namespaces:
  create: true
  observability:
    name: observability
    labels:
      name: observability
      purpose: monitoring
  logging:
    name: logging
    labels:
      name: logging
      purpose: logging
  tracing:
    name: tracing
    labels:
      name: tracing
      purpose: tracing

# Prometheus configuration
prometheus:
  enabled: true
  namespace: observability
  replicas: 1
  
  image:
    repository: prom/prometheus
    tag: v2.38.0
    pullPolicy: IfNotPresent
  
  # Container arguments configuration  
  args:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus/
    - --web.console.libraries=/etc/prometheus/console_libraries
    - --web.console.templates=/etc/prometheus/consoles
    - --web.enable-lifecycle
    - --web.route-prefix=/
  
  # External URL will be dynamically constructed from ingress host
  externalUrl: ""  # Will be set dynamically in template
  
  service:
    type: ClusterIP
    port: 9090
  
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi
  
  # Security context to fix permission issues
  securityContext:
    runAsUser: 65534
    runAsNonRoot: true
    runAsGroup: 65534
    fsGroup: 65534
  
  persistence:
    enabled: true
    size: 8Gi
    accessMode: ReadWriteOnce
    storageClass: ""
  
  config:
    scrapeInterval: 15s
    evaluationInterval: 15s
  
  retention: 20h
  
  # AlertManager integration
  alerting:
    enabled: true
    alertmanagerUrl: "alertmanager:9093"

# Grafana configuration  
grafana:
  enabled: true
  namespace: observability
  replicas: 1
  
  image:
    repository: grafana/grafana
    tag: 9.0.5
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 3000
  
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  
  persistence:
    enabled: true
    size: 2Gi
    accessMode: ReadWriteOnce
    storageClass: ""
  
  # Security context to fix volume permissions
  securityContext:
    runAsUser: 472
    runAsGroup: 0
    fsGroup: 472
  
  # Admin credentials (use global values)
  adminUser: ""  # Will use global.adminCredentials.user
  adminPassword: ""  # Will use global.adminCredentials.password
  
  # Server configuration for sub-path serving
  server:
    rootUrl: "%(protocol)s://%(domain)s:%(http_port)s/grafana/"
    serveFromSubPath: true
  
  # Datasources auto-provisioning
  datasources:
    prometheus:
      enabled: true
      url: "http://prometheus:9090"
      isDefault: true
    alertmanager:
      enabled: true
      url: "http://alertmanager:9093"

# AlertManager configuration
alertmanager:
  enabled: true
  namespace: observability
  replicas: 1
  
  image:
    repository: prom/alertmanager
    tag: v0.25.0
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 9093
  
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
  
  persistence:
    enabled: true
    size: 1Gi
    accessMode: ReadWriteOnce
    storageClass: ""
  
  # Notification configuration (use global values)
  config:
    global:
      smtpSmarthost: ""  # Will use global.smtp.smarthost
      smtpFrom: ""  # Will use global.smtp.from
    
    receivers:
      name: 'web.hook'
      webhook_configs:
      - url: 'http://webhook-receiver:8080/webhook'
        send_resolved: true
    
    route:
      group_by: ['alertname']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 1h
      receiver: 'web.hook'

# Node Exporter configuration
node-exporter:
  enabled: true
  namespace: observability
  
  image:
    repository: prom/node-exporter
    tag: v1.3.1
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 9100
  
  resources:
    limits:
      cpu: 200m
      memory: 50Mi
    requests:
      cpu: 100m
      memory: 30Mi
  
  # DaemonSet configuration
  hostNetwork: true
  hostPID: true
  
  # Security context
  securityContext:
    runAsUser: 65534
    runAsGroup: 65534
    runAsNonRoot: true
  
  tolerations:
  - operator: Exists
    effect: NoSchedule

# cAdvisor configuration
cadvisor:
  enabled: true
  namespace: observability
  
  image:
    repository: gcr.io/cadvisor/cadvisor
    tag: v0.45.0
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 8080
  
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 60Mi
  
  # Container arguments - minimal configuration for stability
  args:
    - --housekeeping_interval=10s
    - --max_housekeeping_interval=15s
    - --event_storage_event_limit=default=0
    - --event_storage_age_limit=default=0
    - --store_container_labels=false

  
  # DaemonSet configuration
  hostNetwork: false
  
  # Security context for GKE - privileged mode required for container metrics
  securityContext:
    privileged: true
  
  tolerations:
  - operator: Exists
    effect: NoSchedule

# Jaeger configuration
jaeger:
  enabled: true
  namespace: tracing
  replicas: 1
  
  image:
    repository: jaegertracing/all-in-one
    tag: "1.47"
    pullPolicy: IfNotPresent
  
  # Sub-path configuration for reverse proxy scenarios
  subPath:
    enabled: false
    basePath: ""
    externalHost: "34.142.154.84.nip.io"
  
  service:
    type: ClusterIP
  
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  
  # Storage configuration
  storage:
    type: memory  # Options: memory, elasticsearch, cassandra

# Elasticsearch configuration
elasticsearch:
  enabled: true
  namespace: logging
  replicas: 1
  
  image:
    repository: docker.elastic.co/elasticsearch/elasticsearch
    tag: 8.8.0
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 9200
    
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 512Mi
      
  persistence:
    enabled: true
    size: 10Gi
    accessMode: ReadWriteOnce
    storageClass: ""
    
  config:
    clusterName: "docker-cluster"
    networkHost: "0.0.0.0"
    discoveryType: "single-node"
    xpackSecurityEnabled: false
    javaOpts: "-Xms512m -Xmx512m"

# Kibana configuration
kibana:
  enabled: true
  namespace: logging
  replicas: 1
  
  image:
    repository: docker.elastic.co/kibana/kibana
    tag: 8.8.0
    pullPolicy: IfNotPresent
    
  service:
    type: ClusterIP
    port: 5601
    
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 512Mi
      
  config:
    serverName: "kibana"
    serverHost: "0.0.0.0"
    elasticsearchHosts: "http://elasticsearch:9200"

# Filebeat configuration
filebeat:
  enabled: true
  namespace: logging
  
  image:
    repository: docker.elastic.co/beats/filebeat
    tag: 8.8.0
    pullPolicy: IfNotPresent
    
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
      
  config:
    elasticsearchHost: "http://elasticsearch:9200"
    logLevel: "info"
    elasticPassword: ""
    
  # DaemonSet configuration for collecting logs from all nodes
  daemonset:
    enabled: true
    
  # Security context
  securityContext:
    runAsUser: 0
    privileged: true

# External access configuration
ingress:
  enabled: true
  className: nginx
  
  # Host configuration (use global values)
  hosts:
    - host: "34.142.154.84.nip.io"  # Will use global.externalHost
      paths:
        - path: /grafana
          service: grafana
          port: 3000
        - path: /prometheus
          service: prometheus
          port: 9090
        - path: /alertmanager
          service: alertmanager
          port: 9093
        - path: /search
          service: jaeger
          port: 16686
        - path: /trace
          service: jaeger
          port: 16686
        - path: /static
          service: jaeger
          port: 16686
        - path: /api
          service: jaeger
          port: 16686
  
  # TLS configuration
  tls: []

# Network policies (optional)
networkPolicies:
  enabled: false
  
# Service mesh integration (optional)
serviceMesh:
  enabled: false
  provider: istio  # Options: istio, linkerd, consul-connect