{{/*
Loop-Based Service Template for Monitoring Stack
This template iterates through all enabled subcharts and creates services
*/}}
{{- $subcharts := list "grafana" "prometheus" "cadvisor" "alertmanager" "node-exporter" "jaeger" "elasticsearch" "kibana" }}
{{- range $subcharts }}
{{- $chartName := . }}
{{- if index $.Values $chartName "enabled" }}
{{- $chartConfig := index $.Values $chartName }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $chartName }}
  namespace: {{ $chartConfig.namespace | default $.Values.global.observabilityNamespace | default "observability" }}
  labels:
    app.kubernetes.io/name: {{ $chartName }}
    app.kubernetes.io/instance: {{ $chartName }}
    app.kubernetes.io/component: {{ $chartName }}
    app.kubernetes.io/part-of: monitoring-stack
    app.kubernetes.io/managed-by: helm
spec:
  type: {{ $chartConfig.service.type | default "ClusterIP" }}
  ports:
  {{- if eq $chartName "prometheus" }}
  - port: {{ $chartConfig.service.port | default 9090 }}
    targetPort: 9090
    protocol: TCP
    name: web
  {{- else if eq $chartName "grafana" }}
  - port: {{ $chartConfig.service.port | default 3000 }}
    targetPort: 3000
    protocol: TCP
    name: http
  {{- else if eq $chartName "alertmanager" }}
  - port: {{ $chartConfig.service.port | default 9093 }}
    targetPort: 9093
    protocol: TCP
    name: web
  {{- else if eq $chartName "node-exporter" }}
  - port: {{ $chartConfig.service.port | default 9100 }}
    targetPort: 9100
    protocol: TCP
    name: metrics
  {{- else if eq $chartName "cadvisor" }}
  - port: {{ $chartConfig.service.port | default 8080 }}
    targetPort: 8080
    protocol: TCP
    name: http
  {{- else if eq $chartName "jaeger" }}
  - port: 16686
    targetPort: 16686
    protocol: TCP
    name: query
  - port: 14268
    targetPort: 14268
    protocol: TCP
    name: collector-http
  - port: 14250
    targetPort: 14250
    protocol: TCP
    name: collector-grpc
  - port: 9411
    targetPort: 9411
    protocol: TCP
    name: zipkin
  {{- else if eq $chartName "elasticsearch" }}
  - port: {{ $chartConfig.service.port | default 9200 }}
    targetPort: 9200
    protocol: TCP
    name: http
  - port: 9300
    targetPort: 9300
    protocol: TCP
    name: transport
  {{- else if eq $chartName "kibana" }}
  - port: {{ $chartConfig.service.port | default 5601 }}
    targetPort: 5601
    protocol: TCP
    name: http
  {{- end }}
  selector:
    app.kubernetes.io/name: {{ $chartName }}
    app.kubernetes.io/instance: {{ $chartName }}
{{- end }}
{{- end }}