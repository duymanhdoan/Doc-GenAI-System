{{/*
OBSERVABILITY PLATFORM NAMESPACE MANAGEMENT
===========================================
Umbrella Chart: Namespace Creation Template

PURPOSE:
Creates isolated namespaces for different components of the observability platform,
enabling proper resource isolation, RBAC, and network policy segmentation.

NAMESPACE STRATEGY:
1. observability: Core monitoring components (Prometheus, Grafana, AlertManager, Jaeger)
   - Contains metrics collection and visualization services
   - Houses alerting and notification systems
   - Centralized tracing infrastructure

2. logging: ELK stack components (Elasticsearch, Kibana, Filebeat)
   - Dedicated namespace for log storage and processing
   - Enables independent scaling and resource management
   - Isolates log data access and security policies

BENEFITS:
- Resource Isolation: CPU, memory, and storage quotas per namespace
- Security Boundaries: RBAC policies scoped to specific namespaces
- Network Segmentation: NetworkPolicies can control inter-namespace communication
- Operational Clarity: Clear separation of concerns for different observability domains

HELM INTEGRATION:
- Conditional creation via .Values.namespaces.create flag
- Global labels applied consistently across all namespaces
- Helm metadata for release tracking and management
*/}}
{{- if .Values.namespaces.create }}
{{/*
CONDITIONAL NAMESPACE CREATION
- Only creates namespaces if .Values.namespaces.create is true
- Allows flexibility for environments where namespaces pre-exist
- Enables GitOps workflows where namespaces are managed separately
*/}}
---
# OBSERVABILITY NAMESPACE
# =======================
# Primary namespace for metrics collection, visualization, and alerting services
# Contains: Prometheus, Grafana, AlertManager, Jaeger, Node Exporter, cAdvisor
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.observability.name }}
  labels:
    # Namespace-specific labels from values.yaml
    {{- with .Values.namespaces.observability.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    # Global labels applied to all resources
    {{- with .Values.global.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    # Pod Security Standard labels for privileged containers (cAdvisor requirement)
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
  annotations:
    # Helm release tracking metadata
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
    # Documentation annotations
    description: "Core observability services for metrics, tracing, and alerting"
    purpose: "Houses Prometheus ecosystem and Jaeger tracing infrastructure"
---
# LOGGING NAMESPACE  
# =================
# Dedicated namespace for log collection, storage, and analysis services
# Contains: Elasticsearch, Kibana, Filebeat (DaemonSet)
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.logging.name }}
  labels:
    # Namespace-specific labels from values.yaml
    {{- with .Values.namespaces.logging.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    # Global labels applied to all resources
    {{- with .Values.global.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    # Helm release tracking metadata
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
    # Documentation annotations  
    description: "ELK stack for centralized logging and log analysis"
    purpose: "Houses Elasticsearch, Kibana, and Filebeat for log management"
---
# TRACING NAMESPACE  
# =================
# Dedicated namespace for distributed tracing services
# Contains: Jaeger
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.tracing.name }}
  labels:
    # Namespace-specific labels from values.yaml
    {{- with .Values.namespaces.tracing.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    # Global labels applied to all resources
    {{- with .Values.global.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    # Helm release tracking metadata
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
    # Documentation annotations  
    description: "Distributed tracing infrastructure"
    purpose: "Houses Jaeger for request tracing and observability"
{{- end }}