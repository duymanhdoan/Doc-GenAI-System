{{/*
Loop-Based PVC Template for Monitoring Stack
Creates PVCs for components that need persistent storage
*/}}
{{- $subcharts := list "prometheus" "grafana" "alertmanager" "elasticsearch" }}
{{- range $subcharts }}
{{- $chartName := . }}
{{- if index $.Values $chartName "enabled" }}
{{- $chartConfig := index $.Values $chartName }}
{{- if and $chartConfig.persistence $chartConfig.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $chartName }}-data
  namespace: {{ $chartConfig.namespace | default $.Values.global.observabilityNamespace | default "observability" }}
  labels:
    app.kubernetes.io/name: {{ $chartName }}
    app.kubernetes.io/instance: {{ $chartName }}
    app.kubernetes.io/component: {{ $chartName }}
    app.kubernetes.io/part-of: monitoring-stack
    app.kubernetes.io/managed-by: helm
spec:
  accessModes:
    - {{ $chartConfig.persistence.accessMode | default "ReadWriteOnce" }}
  resources:
    requests:
      storage: {{ $chartConfig.persistence.size }}
  {{- if $chartConfig.persistence.storageClass }}
  storageClassName: {{ $chartConfig.persistence.storageClass }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}