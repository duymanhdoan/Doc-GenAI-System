{{/*
Configuration Templates for Monitoring Stack Components
*/}}
{{- if .Values.prometheus.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: {{ .Values.prometheus.namespace | default .Values.global.observabilityNamespace | default "observability" }}
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: prometheus
    app.kubernetes.io/component: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.prometheus.config.scrapeInterval | default "15s" }}
      evaluation_interval: {{ .Values.prometheus.config.evaluationInterval | default "15s" }}
    
    {{- if .Values.prometheus.alerting.enabled }}
    alerting:
      alertmanagers:
      - static_configs:
        - targets:
          - {{ .Values.prometheus.alerting.alertmanagerUrl | default .Values.global.services.alertmanager }}
    {{- end }}

    scrape_configs:
    - job_name: 'prometheus'
      static_configs:
      - targets: ['{{ .Values.global.services.prometheus }}']

    {{- if .Values.grafana.enabled }}
    - job_name: 'grafana'
      static_configs:
      - targets: ['{{ .Values.global.services.grafana }}']
    {{- end }}

    {{- if .Values.alertmanager.enabled }}
    - job_name: 'alertmanager'
      static_configs:
      - targets: ['{{ .Values.global.services.alertmanager }}']
    {{- end }}

    {{- if index .Values "node-exporter" "enabled" }}
    - job_name: 'node-exporter'
      static_configs:
      - targets: ['node-exporter:9100']
      kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
          - {{ .Values.global.observabilityNamespace | default "observability" }}
      relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        regex: node-exporter
        action: keep
      - source_labels: [__meta_kubernetes_pod_ip]
        target_label: __address__
        replacement: ${1}:9100
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: instance
    {{- end }}

    {{- if .Values.cadvisor.enabled }}
    - job_name: 'cadvisor'
      static_configs:
      - targets: ['cadvisor:8080']
      kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
          - {{ .Values.global.observabilityNamespace | default "observability" }}
      relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        regex: cadvisor
        action: keep
      - source_labels: [__meta_kubernetes_pod_ip]
        target_label: __address__
        replacement: ${1}:8080
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: instance
    {{- end }}
{{- end }}

{{- if .Values.grafana.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: {{ .Values.grafana.namespace | default .Values.global.observabilityNamespace | default "observability" }}
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: grafana
    app.kubernetes.io/component: grafana
data:
  datasource.yaml: |
    apiVersion: 1
    deleteDatasources:
      - name: Prometheus
        orgId: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: {{ .Values.grafana.datasources.prometheus.url | default (printf "http://%s" .Values.global.services.prometheus) }}
        isDefault: {{ .Values.grafana.datasources.prometheus.isDefault | default true }}
        version: 1
        editable: false
      {{- if .Values.grafana.datasources.alertmanager.enabled }}
      - name: AlertManager
        type: alertmanager
        access: proxy
        url: {{ .Values.grafana.datasources.alertmanager.url | default (printf "http://%s" .Values.global.services.alertmanager) }}
        isDefault: false
        version: 1
        editable: false
      {{- end }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: {{ .Values.grafana.namespace | default .Values.global.observabilityNamespace | default "observability" }}
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: grafana
    app.kubernetes.io/component: grafana
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
    - name: 'default'
      orgId: 1
      folder: ''
      type: file
      disableDeletion: false
      updateIntervalSeconds: 10
      allowUiUpdates: true
      options:
        path: /opt/grafana/dashboards
{{- end }}

{{- if .Values.alertmanager.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: {{ .Values.alertmanager.namespace | default .Values.global.observabilityNamespace | default "observability" }}
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/instance: alertmanager
    app.kubernetes.io/component: alertmanager
data:
  alertmanager.yml: |
    global:
      smtp_smarthost: {{ .Values.alertmanager.config.global.smtpSmarthost | default .Values.global.smtp.smarthost }}
      smtp_from: {{ .Values.alertmanager.config.global.smtpFrom | default .Values.global.smtp.from }}

    route:
      group_by: {{ .Values.alertmanager.config.route.group_by | default "['alertname']" }}
      group_wait: {{ .Values.alertmanager.config.route.group_wait | default "5s" }}
      group_interval: {{ .Values.alertmanager.config.route.group_interval | default "10s" }}
      repeat_interval: {{ .Values.alertmanager.config.route.repeat_interval | default "15s" }}
      receiver: {{ .Values.alertmanager.config.route.receiver | default "discord" }}

    receivers:
    - name: {{ .Values.alertmanager.config.receivers.name | default "discord" }}
      {{- if .Values.alertmanager.config.receivers.discord_configs }}
      discord_configs:
      {{- range .Values.alertmanager.config.receivers.discord_configs }}
      - webhook_url: {{ .webhook_url | quote }}
        send_resolved: {{ .send_resolved | default true }}
        title: {{ .title | default "Prometheus Alert - {{ .Status | toUpper }}" | quote }}
        message: |
          {{ .message | default "{{ range .Alerts }}\n**Alert:** {{ .Annotations.summary }}\n**Description:** {{ .Annotations.description }}\n**Severity:** {{ .Labels.severity }}\n**Status:** {{ .Status }}\n{{ end }}" | nindent 10 }}
      {{- end }}
      {{- end }}
{{- end }}

{{- if .Values.filebeat.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-config
  namespace: {{ .Values.filebeat.namespace | default .Values.global.loggingNamespace | default "logging" }}
  labels:
    app.kubernetes.io/name: filebeat
    app.kubernetes.io/instance: filebeat
    app.kubernetes.io/component: filebeat
data:
  filebeat.yml: |
    filebeat.inputs:
    - type: container
      paths:
        - /var/log/containers/*.log
      processors:
        - add_kubernetes_metadata:
            host: ${NODE_NAME}
            matchers:
            - logs_path:
                logs_path: "/var/log/containers/"

    processors:
      - add_cloud_metadata:
      - add_host_metadata:

    output.elasticsearch:
      hosts: ['{{ .Values.filebeat.config.elasticsearchHost | default .Values.global.services.elasticsearch }}']
      
    logging.level: {{ .Values.filebeat.config.logLevel | default "info" }}
    logging.to_files: true
    logging.files:
      path: /var/log/filebeat
      name: filebeat
      keepfiles: 7
      permissions: 0644
{{- end }}