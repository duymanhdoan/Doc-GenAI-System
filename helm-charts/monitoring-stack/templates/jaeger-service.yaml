{{/*
JAEGER EXTERNAL SERVICE CONFIGURATION
=====================================
Creates an ExternalName service in the observability namespace that points to the
monitoring-stack-jaeger service in the tracing namespace. This is required because
Kubernetes Ingress can only reference services in the same namespace.

This service acts as a bridge to allow the ingress in the observability namespace
to route traffic to the Jaeger service running in the tracing namespace.
*/}}
{{- if .Values.jaeger.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: {{ .Values.namespaces.observability.name }}
  labels:
    {{- with .Values.global.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    app.kubernetes.io/component: jaeger-proxy
    observability.platform/service-type: "tracing"
spec:
  type: ExternalName
  externalName: monitoring-stack-jaeger.tracing.svc.cluster.local
  ports:
  - name: jaeger-ui
    port: 16686
    targetPort: 16686
    protocol: TCP
{{- end }}