{{/*
UMBRELLA CHART DAEMONSET TEMPLATE - NODE-LEVEL OBSERVABILITY AGENTS
===================================================================
This template creates DaemonSet resources for observability agents that must run
on every node in the Kubernetes cluster to collect system-level metrics and logs.

DAEMONSET PATTERN EXPLANATION:
- DaemonSets ensure exactly one pod runs on each node
- Essential for collecting host-level metrics and logs
- Automatic scheduling on new nodes as cluster scales
- Tolerate node taints to run on all nodes including masters

AGENTS MANAGED BY THIS TEMPLATE:
1. node-exporter: Host system metrics (CPU, memory, disk, network)
2. cadvisor: Container resource metrics and performance data
3. filebeat: Log collection agent for centralized logging

OBSERVABILITY PILLARS COVERED:
- METRICS PILLAR: node-exporter and cadvisor provide system/container metrics
- LOGGING PILLAR: filebeat collects and forwards logs to Elasticsearch

SECURITY CONSIDERATIONS:
- Host network/PID access for system-level monitoring
- Read-only host filesystem mounts for security
- Privileged access only where necessary
*/}}
{{- $daemonsets := list "node-exporter" "cadvisor" "filebeat" }}
{{/*
DAEMONSET SERVICES ITERATION LOOP
================================
Processes each node-level monitoring agent for deployment
*/}}
{{- range $daemonsets }}
{{- $chartName := . }}
{{/*
CONDITIONAL DAEMONSET DEPLOYMENT
===============================
Only creates DaemonSet if the service is enabled in values.yaml
*/}}
{{- if index $.Values $chartName "enabled" }}
{{- $chartConfig := index $.Values $chartName }}
---
# DAEMONSET FOR {{ $chartName | upper }} NODE AGENT
# {{ printf "=%.50s" "==================================================" }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ $chartName }}
  # NAMESPACE SELECTION
  # ==================
  # Filebeat typically goes to 'logging' namespace, others to 'observability'
  namespace: {{ $chartConfig.namespace | default $.Values.global.observabilityNamespace | default "observability" }}
  labels:
    # KUBERNETES RECOMMENDED LABELS
    # ============================
    app.kubernetes.io/name: {{ $chartName }}                          # Agent identifier
    app.kubernetes.io/instance: {{ $chartName }}                      # Instance identifier
    app.kubernetes.io/version: {{ $chartConfig.image.tag | default "latest" }}  # Version tracking
    app.kubernetes.io/component: {{ $chartName }}                     # Component type
    app.kubernetes.io/part-of: monitoring-stack                       # Parent system
    app.kubernetes.io/managed-by: helm                                # Management tool
    # OBSERVABILITY PLATFORM LABELS
    # ============================
    {{- if or (eq $chartName "node-exporter") (eq $chartName "cadvisor") }}
    observability.platform/pillar: "metrics"                          # Metrics collection agents
    observability.platform/scope: "node-level"                        # Node-level monitoring
    {{- else if eq $chartName "filebeat" }}
    observability.platform/pillar: "logging"                          # Log collection agent
    observability.platform/scope: "cluster-wide"                      # Cluster-wide log collection
    {{- end }}
spec:
  # POD SELECTOR FOR DAEMONSET
  # =========================
  # Labels used to identify pods managed by this DaemonSet
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $chartName }}              # Service name selector
      app.kubernetes.io/instance: {{ $chartName }}          # Instance name selector
      
  # POD TEMPLATE SPECIFICATION
  # =========================
  # Template for pods that will run on each node
  template:
    metadata:
      labels:
        # POD LABELS
        # =========
        # Must include all labels from selector.matchLabels
        app.kubernetes.io/name: {{ $chartName }}            # Pod service identifier
        app.kubernetes.io/instance: {{ $chartName }}        # Pod instance identifier
        app.kubernetes.io/component: {{ $chartName }}       # Pod component type
      annotations:
        # POD ANNOTATIONS
        # ==============
        # Prometheus service discovery annotations
        {{- if eq $chartName "node-exporter" }}
        prometheus.io/scrape: "true"                         # Enable Prometheus scraping
        prometheus.io/port: "9100"                           # Node Exporter metrics port
        prometheus.io/path: "/metrics"                       # Metrics endpoint path
        {{- else if eq $chartName "cadvisor" }}
        prometheus.io/scrape: "true"                         # Enable Prometheus scraping
        prometheus.io/port: "8080"                           # cAdvisor metrics port  
        prometheus.io/path: "/metrics"                       # Metrics endpoint path
        {{- end }}
        {{- if eq $chartName "filebeat" }}
        co.elastic.logs/enabled: "false"                     # Don't collect Filebeat's own logs
        {{- end }}
    spec:
      # HOST NETWORK AND PID ACCESS
      # ==========================
      # Required for system-level monitoring and log collection
      {{- if $chartConfig.hostNetwork }}
      hostNetwork: {{ $chartConfig.hostNetwork }}           # Access host network stack
      {{- end }}
      {{- if $chartConfig.hostPID }}
      hostPID: {{ $chartConfig.hostPID }}                   # Access host PID namespace
      {{- end }}
      
      # SERVICE ACCOUNT TOKEN CONFIGURATION
      # ==================================
      # Disable automatic mounting for GKE compatibility with cAdvisor
      {{- if eq $chartName "cadvisor" }}
      automountServiceAccountToken: false
      {{- end }}
      
      # NODE TOLERATIONS
      # ===============
      # Allow scheduling on tainted nodes (including master nodes)
      {{- if $chartConfig.tolerations }}
      tolerations:
        {{- toYaml $chartConfig.tolerations | nindent 8 }}  # Tolerate taints from values.yaml
      {{- end }}
      
      # MAIN AGENT CONTAINER
      # ===================
      containers:
      - name: {{ $chartName }}
        # CONTAINER IMAGE CONFIGURATION
        # ============================
        image: "{{ $chartConfig.image.repository }}:{{ $chartConfig.image.tag }}"
        imagePullPolicy: {{ $chartConfig.image.pullPolicy | default $.Values.global.imagePullPolicy | default "IfNotPresent" }}
        {{/*
        AGENT-SPECIFIC CONFIGURATION
        ============================
        Each monitoring agent has unique requirements for ports, arguments, and host access
        */}}
        {{- if eq $chartName "node-exporter" }}
        {{/*
        NODE EXPORTER CONFIGURATION - HOST SYSTEM METRICS
        ================================================
        Collects hardware and operating system metrics from the host node
        */}}
        # NODE EXPORTER NETWORK PORTS
        # ===========================
        ports:
        - containerPort: 9100                # Node Exporter metrics port
          name: metrics                      # Port name for service reference
          protocol: TCP
          hostPort: 9100                     # Expose on host network for direct access
          
        # NODE EXPORTER STARTUP ARGUMENTS
        # ===============================
        # Command-line arguments for Node Exporter configuration
        args:
        - --path.procfs=/host/proc           # Host /proc filesystem path
        - --path.sysfs=/host/sys             # Host /sys filesystem path  
        - --path.rootfs=/host/root           # Host root filesystem path
        # FILESYSTEM COLLECTOR EXCLUSIONS
        # ===============================
        # Exclude Docker and Kubernetes internal mount points from filesystem metrics
        - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
        # Exclude virtual/pseudo filesystems from filesystem metrics
        - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$
        
        # NODE EXPORTER VOLUME MOUNTS
        # ===========================
        # Host filesystem mounts for system metrics collection
        volumeMounts:
        - name: proc
          mountPath: /host/proc              # Host /proc for process metrics
          readOnly: true                     # Read-only access for security
        - name: sys
          mountPath: /host/sys               # Host /sys for system metrics
          readOnly: true                     # Read-only access for security
        - name: root
          mountPath: /host/root              # Host root filesystem for disk metrics
          mountPropagation: HostToContainer  # Propagate host mount changes to container
          readOnly: true                     # Read-only access for security
        {{- else if eq $chartName "cadvisor" }}
        {{/*
        CADVISOR CONFIGURATION - CONTAINER RESOURCE METRICS
        ==================================================
        Collects resource usage and performance characteristics of running containers
        */}}
        # CADVISOR NETWORK PORTS
        # =====================
        ports:
        - containerPort: 8080                # cAdvisor web interface and metrics port
          name: http                         # Port name for service reference
          protocol: TCP
          
        # CADVISOR STARTUP ARGUMENTS
        # =========================
        # Command-line arguments for cAdvisor optimization in GKE
        {{- if $chartConfig.args }}
        args:
        {{- range $chartConfig.args }}
        - {{ . | quote }}
        {{- end }}
        {{- end }}
        
        # CADVISOR ENVIRONMENT VARIABLES
        # ==============================
        # Disable service account token automounting for GKE compatibility
        env:
        - name: PATH
          value: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          
        # CADVISOR VOLUME MOUNTS
        # =====================
        # Host filesystem access for container metrics collection
        volumeMounts:
        - name: rootfs
          mountPath: /rootfs                 # Host root filesystem for container discovery
          readOnly: true                     # Read-only access for security
        - name: var-run
          mountPath: /var/run                # Runtime data (sockets, PIDs) for container info
          readOnly: true                     # Read-only access for security  
        - name: sys
          mountPath: /sys                    # System information for cgroup metrics
          readOnly: true                     # Read-only access for security
        - name: docker
          mountPath: /var/lib/docker         # Docker data directory for container metadata
          readOnly: true                     # Read-only access for security
        - name: disk
          mountPath: /dev/disk               # Disk devices for I/O metrics
          readOnly: true                     # Read-only access for security
        {{- else if eq $chartName "filebeat" }}
        {{/*
        FILEBEAT CONFIGURATION - LOG COLLECTION AGENT
        ============================================
        Lightweight shipper for forwarding and centralizing log data
        */}}
        # FILEBEAT STARTUP ARGUMENTS
        # =========================
        # Command-line arguments for Filebeat configuration
        args:
        - -c                                 # Configuration file flag
        - /etc/filebeat.yml                  # Configuration file path
        - -e                                 # Log to stderr instead of syslog
        
        # FILEBEAT ENVIRONMENT VARIABLES
        # =============================
        # Configuration for Elasticsearch connection and node identification
        env:
        - name: ELASTICSEARCH_HOST
          # Elasticsearch service URL for log forwarding
          value: {{ $chartConfig.config.elasticsearchHost | quote }}
        - name: ELASTICSEARCH_PORT
          # Elasticsearch HTTP port for connection
          value: "9200"
        - name: NODE_NAME
          # Kubernetes node name for log source identification
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName       # Inject node name from pod spec
              
        # FILEBEAT VOLUME MOUNTS
        # =====================
        # Configuration and log data access
        volumeMounts:
        - name: config
          mountPath: /etc/filebeat.yml       # Filebeat configuration file
          readOnly: true                     # Configuration is read-only
          subPath: filebeat.yml              # Extract specific file from ConfigMap
        - name: data
          mountPath: /usr/share/filebeat/data # Filebeat state and registry data
        - name: varlibdockercontainers
          mountPath: /var/lib/docker/containers # Docker container logs directory
          readOnly: true                     # Read-only access to container logs
        - name: varlog
          mountPath: /var/log                # System and application logs directory
          readOnly: true                     # Read-only access to system logs
        {{- end }}
        # SECURITY CONTEXT CONFIGURATION
        # ==============================
        # Container-level security settings for privilege and access control
        {{- if $chartConfig.securityContext }}
        securityContext:
          # Security configuration from values.yaml (runAsUser, capabilities, etc.)
          {{- toYaml $chartConfig.securityContext | nindent 10 }}
        {{- end }}
        
        # RESOURCE ALLOCATION
        # ==================
        # CPU and memory limits/requests for container performance
        {{- if $chartConfig.resources }}
        resources:
          # Resource configuration from values.yaml (limits, requests)
          {{- toYaml $chartConfig.resources | nindent 10 }}
        {{- end }}
        
      # HOST VOLUME DEFINITIONS
      # ======================
      # Host filesystem mounts required for system-level monitoring
      volumes:
      {{- if eq $chartName "node-exporter" }}
      # NODE EXPORTER HOST VOLUMES
      # ==========================
      # Direct access to host filesystem for system metrics collection
      - name: proc
        hostPath:
          path: /proc                        # Host /proc filesystem (process information)
      - name: sys
        hostPath:
          path: /sys                         # Host /sys filesystem (system information)  
      - name: root
        hostPath:
          path: /                            # Host root filesystem (disk usage metrics)
          
      {{- else if eq $chartName "cadvisor" }}
      # CADVISOR HOST VOLUMES
      # ====================
      # Container runtime and system access for container metrics
      - name: rootfs
        hostPath:
          path: /                            # Host root filesystem
      - name: var-run
        hostPath:
          path: /var/run                     # Runtime sockets and process information
      - name: sys
        hostPath:
          path: /sys                         # System cgroup information
      - name: docker
        hostPath:
          path: /var/lib/docker              # Docker daemon data directory
      - name: disk
        hostPath:
          path: /dev/disk                    # Disk device information for I/O metrics
          
      {{- else if eq $chartName "filebeat" }}
      # FILEBEAT VOLUMES
      # ===============
      # Configuration and log file access for centralized logging
      - name: config
        configMap:
          defaultMode: 0640                  # Read-only permissions for config file
          name: filebeat-config              # ConfigMap containing filebeat.yml
      - name: varlibdockercontainers
        hostPath:
          path: /var/lib/docker/containers   # Container logs directory
      - name: varlog
        hostPath:
          path: /var/log                     # System logs directory
      - name: data
        hostPath:
          path: /var/lib/filebeat-data       # Filebeat registry and state data
          type: DirectoryOrCreate            # Create directory if it doesn't exist
      {{- end }}
{{/*
END OF DAEMONSET SERVICE ITERATION LOOP
======================================
*/}}
{{- end }}
{{/*
END OF ENABLED DAEMONSET SERVICE CHECK
====================================
*/}}
{{- end }}