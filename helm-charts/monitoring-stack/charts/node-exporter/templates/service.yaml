apiVersion: v1
kind: Service
metadata:
  name: {{ include "node-exporter.fullname" . }}
  namespace: {{ .Values.global.namespace | default .Release.Namespace | default "observability" }}
  labels:
    {{- include "node-exporter.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
  - port: {{ .Values.service.port }}
    targetPort: 9100
    protocol: TCP
    name: http
  selector:
    {{- include "node-exporter.selectorLabels" . | nindent 4 }}