apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "jaeger.fullname" . }}
  namespace: {{ .Values.global.namespace | default "tracing" }}
  labels:
    {{- include "jaeger.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "jaeger.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "jaeger.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: jaeger
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        {{- if .Values.subPath.enabled }}
        env:
        - name: QUERY_BASE_PATH
          value: {{ .Values.subPath.basePath | quote }}
        {{- end }}
        ports:
        - containerPort: 16686
          name: ui
          protocol: TCP
        - containerPort: 6831
          name: udp
          protocol: UDP
        - containerPort: 14268
          name: http-thrift
          protocol: TCP
        - containerPort: 14250
          name: grpc
          protocol: TCP
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /
            port: 16686
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /
            port: 16686
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 5