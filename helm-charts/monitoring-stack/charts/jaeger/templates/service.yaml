apiVersion: v1
kind: Service
metadata:
  name: {{ include "jaeger.fullname" . }}
  namespace: {{ .Values.global.namespace | default "tracing" }}
  labels:
    {{- include "jaeger.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
  - port: {{ .Values.service.ports.ui }}
    targetPort: 16686
    protocol: TCP
    name: ui
  - port: {{ .Values.service.ports.udp }}
    targetPort: 6831
    protocol: UDP
    name: udp
  - port: 14268
    targetPort: 14268
    protocol: TCP
    name: http-thrift
  - port: 14250
    targetPort: 14250
    protocol: TCP
    name: grpc
  selector:
    {{- include "jaeger.selectorLabels" . | nindent 4 }}