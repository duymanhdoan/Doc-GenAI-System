global:
  namespace: logging

image:
  repository: docker.elastic.co/elasticsearch/elasticsearch
  tag: 8.8.0
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 9200

resources:
  requests:
    memory: "512Mi"
    cpu: "100m"
  limits:
    memory: "1Gi"
    cpu: "500m"

persistence:
  enabled: true
  size: 10Gi
  storageClass: ""

config:
  clusterName: "docker-cluster"
  networkHost: "0.0.0.0"
  discoveryType: "single-node"
  xpackSecurityEnabled: false
  javaOpts: "-Xms256m -Xmx512m"