global:
  namespace: logging

image:
  repository: docker.elastic.co/beats/filebeat
  tag: 8.8.0
  pullPolicy: IfNotPresent

resources:
  requests:
    memory: "256Mi"
    cpu: "50m"
  limits:
    memory: "512Mi"
    cpu: "200m"

config:
  elasticsearchHost: "http://elasticsearch:9200"
  logLevel: "info"
  elasticPassword: ""

# DaemonSet configuration for collecting logs from all nodes
daemonset:
  enabled: true
  
# Security context
securityContext:
  runAsUser: 0
  privileged: true