---
# Source: filebeat/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: filebeat-deploy
  labels:
    helm.sh/chart: filebeat-0.1.0
    app.kubernetes.io/name: filebeat
    app.kubernetes.io/instance: filebeat-deploy
    app.kubernetes.io/version: "8.8.0"
    app.kubernetes.io/managed-by: Helm
---
# Source: filebeat/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-deploy-config
  labels:
    helm.sh/chart: filebeat-0.1.0
    app.kubernetes.io/name: filebeat
    app.kubernetes.io/instance: filebeat-deploy
    app.kubernetes.io/version: "8.8.0"
    app.kubernetes.io/managed-by: Helm
data:
  filebeat.yml: |-
    filebeat.inputs:
    - type: container
      paths:
        - /var/log/containers/*.log
      processors:
        - add_kubernetes_metadata:
            host: ${NODE_NAME}
            matchers:
            - logs_path:
                logs_path: "/var/log/containers/"

    # To enable hints based autodiscover, remove `filebeat.inputs` configuration and uncomment this:
    #filebeat.autodiscover:
    #  providers:
    #    - type: kubernetes
    #      node: ${NODE_NAME}
    #      hints.enabled: true
    #      hints.default_config:
    #        type: container
    #        paths:
    #          - /var/log/containers/*${data.kubernetes.container.id}.log

    processors:
      - add_cloud_metadata:
      - add_host_metadata:

    cloud.id: ${ELASTIC_CLOUD_ID}
    cloud.auth: ${ELASTIC_CLOUD_AUTH}

    output.elasticsearch:
      hosts: ['http://elasticsearch:9200']
      
    logging.level: info
    logging.to_files: true
    logging.files:
      path: /var/log/filebeat
      name: filebeat
      keepfiles: 7
      permissions: 0644
---
# Source: filebeat/templates/serviceaccount.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: filebeat-deploy
  labels:
    helm.sh/chart: filebeat-0.1.0
    app.kubernetes.io/name: filebeat
    app.kubernetes.io/instance: filebeat-deploy
    app.kubernetes.io/version: "8.8.0"
    app.kubernetes.io/managed-by: Helm
rules:
- apiGroups: [""]
  resources:
  - nodes
  - namespaces
  - events
  - pods
  verbs: ["get", "list", "watch"]
- apiGroups: ["extensions"]
  resources:
  - replicasets
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources:
  - statefulsets
  - deployments
  - replicasets
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources:
  - nodes/stats
  verbs: ["get"]
---
# Source: filebeat/templates/serviceaccount.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: filebeat-deploy
  labels:
    helm.sh/chart: filebeat-0.1.0
    app.kubernetes.io/name: filebeat
    app.kubernetes.io/instance: filebeat-deploy
    app.kubernetes.io/version: "8.8.0"
