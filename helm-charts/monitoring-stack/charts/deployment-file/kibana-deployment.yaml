---
# Source: kibana/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: kibana-deploy
  labels:
    helm.sh/chart: kibana-0.1.0
    app.kubernetes.io/name: kibana
    app.kubernetes.io/instance: kibana-deploy
    app.kubernetes.io/version: "8.8.0"
    app.kubernetes.io/managed-by: Helm
spec:
  type: ClusterIP
  ports:
    - port: 5601
      targetPort: 5601
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: kibana
    app.kubernetes.io/instance: kibana-deploy
---
# Source: kibana/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana-deploy
  labels:
    helm.sh/chart: kibana-0.1.0
    app.kubernetes.io/name: kibana
    app.kubernetes.io/instance: kibana-deploy
    app.kubernetes.io/version: "8.8.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kibana
      app.kubernetes.io/instance: kibana-deploy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kibana
        app.kubernetes.io/instance: kibana-deploy
    spec:
      containers:
        - name: kibana
          image: "docker.elastic.co/kibana/kibana:8.8.0"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5601
              protocol: TCP
          env:
            - name: SERVER_NAME
              value: kibana
            - name: SERVER_HOST
              value: 0.0.0.0
            - name: ELASTICSEARCH_HOSTS
              value: http://elasticsearch:9200
            - name: XPACK_SECURITY_ENABLED
              value: "false"
          resources:
            limits:
              cpu: 500m
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/status
              port: 5601
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/status
              port: 5601
            initialDelaySeconds: 120
            periodSeconds: 60
            timeoutSeconds: 10
