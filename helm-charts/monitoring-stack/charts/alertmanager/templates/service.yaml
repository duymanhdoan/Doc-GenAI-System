apiVersion: v1
kind: Service
metadata:
  name: {{ include "alertmanager.fullname" . }}
  namespace: {{ .Values.global.namespace | default .Release.Namespace | default "observability" }}
  labels:
    {{- include "alertmanager.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
  - port: {{ .Values.service.port }}
    targetPort: 9093
    protocol: TCP
    name: http
  selector:
    {{- include "alertmanager.selectorLabels" . | nindent 4 }}

    