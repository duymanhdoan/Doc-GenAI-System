# KIBANA CONFIGURATION WITH PARENT CHART INTEGRATION
# ==================================================
# This configuration maps parent monitoring-stack values to kibana subchart
# Ensures compliance with LOGS monitoring flow requirements

# PARENT CHART GLOBAL CONFIGURATION MAPPING
# ==========================================
# Inherits from parent monitoring-stack global values
global:
  # Namespace assignment for LOGS flow
  namespace: logging
  loggingNamespace: logging
  
  # External access configuration
  externalHost: "34.87.137.82.nip.io"
  protocol: "http"
  
  # Common labels for monitoring-stack integration
  commonLabels:
    app.kubernetes.io/part-of: monitoring-stack
    app.kubernetes.io/managed-by: helm
    observability.flow: logs
    observability.component: visualization
  
  # Image pull policy
  imagePullPolicy: IfNotPresent
  
  # Admin credentials for Kibana
  adminCredentials:
    user: admin
    password: admin
  
  # Service URLs for internal LOGS flow communication
  services:
    elasticsearch: "elasticsearch:9200"
    kibana: "kibana:5601"

# KIBANA DEPLOYMENT CONFIGURATION
# ===============================
image:
  repository: docker.elastic.co/kibana/kibana
  tag: 8.8.0
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 5601

resources:
  requests:
    memory: "256Mi"
    cpu: "200m"
  limits:
    memory: "1Gi"
    cpu: "1000m"

config:
  serverName: "kibana"
  serverHost: "0.0.0.0"
  serverBasePath: "/kibana"  # Path-based routing for ingress
  serverRewriteBasePath: true
  elasticsearchHosts: "http://elasticsearch:9200"  # Uses LOGS flow service discovery
  xpackLicenseManagementEnabled: false
  xpackSecurityEnabled: false
  cspRules: false
  cspScriptSrc: "'self' 'unsafe-inline' 'unsafe-eval'"
  cspStyleSrc: "'self' 'unsafe-inline' https://fonts.googleapis.com"
  cspFontSrc: "'self' https://fonts.gstatic.com"

# NGINX INGRESS CONFIGURATION FOR LOGS FLOW
# ==========================================
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      # Kibana UI path rewriting for proper sub-path access
      # Preserves /kibana prefix for correct dashboard routing
      rewrite ^/kibana/(.*)$ /$1 break;
  host: "" # Will use global.externalHost
  paths:
    - path: /kibana
      pathType: Prefix
      backend:
        service:
          name: kibana
          port:
            number: 5601