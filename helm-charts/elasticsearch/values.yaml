# ELASTICSEARCH CONFIGURATION WITH PARENT CHART INTEGRATION
# =========================================================
# This configuration maps parent monitoring-stack values to elasticsearch subchart
# Ensures compliance with LOGS monitoring flow requirements

# PARENT CHART GLOBAL CONFIGURATION MAPPING
# ==========================================
# Inherits from parent monitoring-stack global values
global:
  # Namespace assignment for LOGS flow
  namespace: logging
  loggingNamespace: logging
  
  # External access configuration
  externalHost: "34.87.137.82.nip.io"
  protocol: "http"
  
  # Common labels for monitoring-stack integration
  commonLabels:
    app.kubernetes.io/part-of: monitoring-stack
    app.kubernetes.io/managed-by: helm
    observability.flow: logs
    observability.component: storage
  
  # Image pull policy
  imagePullPolicy: IfNotPresent
  
  # Admin credentials for Elasticsearch
  adminCredentials:
    user: admin
    password: admin
  
  # Service URLs for internal LOGS flow communication
  services:
    elasticsearch: "elasticsearch:9200"
    kibana: "kibana:5601"

# ELASTICSEARCH DEPLOYMENT CONFIGURATION
# ======================================
image:
  repository: docker.elastic.co/elasticsearch/elasticsearch
  tag: 8.8.0
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 9200

resources:
  requests:
    memory: "512Mi"
    cpu: "100m"
  limits:
    memory: "1Gi"
    cpu: "500m"

persistence:
  enabled: true
  size: 10Gi
  storageClass: ""

config:
  clusterName: "docker-cluster"
  networkHost: "0.0.0.0"
  discoveryType: "single-node"
  xpackSecurityEnabled: false
  javaOpts: "-Xms256m -Xmx512m"

# NGINX INGRESS CONFIGURATION FOR LOGS FLOW
# ==========================================
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      # Elasticsearch API access configuration
      rewrite ^/elasticsearch/(.*)$ /$1 break;
  host: "" # Will use global.externalHost
  paths:
    - path: /elasticsearch
      pathType: Prefix
      backend:
        service:
          name: elasticsearch
          port:
            number: 9200