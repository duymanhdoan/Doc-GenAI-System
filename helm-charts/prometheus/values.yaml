# PROMETHEUS CONFIGURATION WITH PARENT CHART INTEGRATION
# ======================================================
# This configuration maps parent monitoring-stack values to prometheus subchart
# Ensures compliance with METRICS monitoring flow requirements

# PARENT CHART GLOBAL CONFIGURATION MAPPING
# ==========================================
# Inherits from parent monitoring-stack global values
global:
  # Namespace assignment for METRICS flow
  namespace: observability
  observabilityNamespace: observability
  
  # External access configuration
  externalHost: "34.87.137.82.nip.io"
  protocol: "http"
  
  # Common labels for monitoring-stack integration
  commonLabels:
    app.kubernetes.io/part-of: monitoring-stack
    app.kubernetes.io/managed-by: helm
    observability.flow: metrics
    observability.component: storage
  
  # Image pull policy
  imagePullPolicy: IfNotPresent
  
  # Admin credentials for Prometheus
  adminCredentials:
    user: admin
    password: admin
  
  # Service URLs for internal METRICS flow communication
  services:
    prometheus: "prometheus:9090"
    grafana: "grafana:3000"
    alertmanager: "alertmanager:9093"
  
  # SMTP configuration for alerts
  smtp:
    smarthost: "localhost:587"
    from: "alertmanager@monitoring.local"

# PROMETHEUS DEPLOYMENT CONFIGURATION
# ===================================
image:
  repository: prom/prometheus
  tag: v2.38.0
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 9090

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 256Mi

persistence:
  enabled: true
  size: 10Gi
  accessMode: ReadWriteOnce
  storageClass: ""

# Container arguments configuration - Internal access only
args:
  - --config.file=/etc/prometheus/prometheus.yml
  - --storage.tsdb.path=/prometheus/
  - --web.console.libraries=/etc/prometheus/console_libraries
  - --web.console.templates=/etc/prometheus/consoles
  - --web.enable-lifecycle
  # Removed external URL configurations for security (internal access only)

# External URL configuration mapped from parent chart
externalUrl: ""  # Will use global.protocol://global.externalHost/prometheus/

config:
  scrapeInterval: 15s
  evaluationInterval: 15s
  retention: 20h

alerting:
  enabled: true
  alertmanagerEndpoint: "http://alertmanager:9093"  # Uses METRICS flow service discovery

# NGINX INGRESS CONFIGURATION FOR METRICS FLOW
# =============================================
# SECURITY: Ingress disabled - Prometheus should only be accessible internally
# External access to Prometheus poses security risks (data exposure, configuration changes)
# Grafana provides secure, authenticated access to Prometheus data for end users
ingress:
  enabled: false
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      # Prometheus API and UI access with path rewriting
      # Preserves /prometheus prefix for correct routing
      rewrite ^/prometheus/(.*)$ /$1 break;
  host: "" # Will use global.externalHost
  paths:
    - path: /prometheus
      pathType: Prefix
      backend:
        service:
          name: prometheus
          port:
            number: 9090