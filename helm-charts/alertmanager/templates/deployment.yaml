apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "alertmanager.fullname" . }}
  namespace: {{ .Values.global.namespace | default .Release.Namespace | default "observability" }}
  labels:
    {{- include "alertmanager.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "alertmanager.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "alertmanager.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 1000
      {{- if .Values.persistence.enabled }}
      initContainers:
      - name: fix-permissions
        image: busybox:1.35
        command:
        - sh
        - -c
        - |
          chown -R 1000:1000 /alertmanager/data
          chmod -R 755 /alertmanager/data
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: alertmanager-data
          mountPath: /alertmanager/data
      {{- end }}
      containers:
      - name: alertmanager
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        args:
          - '--config.file=/alertmanager/config.yml'
          - '--storage.path=/alertmanager/data'
          - '--log.level=debug'
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        ports:
        - containerPort: 9093
          name: http
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        volumeMounts:
        - name: config-volume
          mountPath: /alertmanager
        {{- if .Values.persistence.enabled }}
        - name: alertmanager-data
          mountPath: /alertmanager/data
        {{- end }}
      volumes:
      - name: config-volume
        configMap:
          name: {{ include "alertmanager.fullname" . }}-config
      {{- if .Values.persistence.enabled }}
      - name: alertmanager-data
        persistentVolumeClaim:
          claimName: {{ include "alertmanager.fullname" . }}-data
      {{- else }}
      - name: alertmanager-data
        emptyDir: {}
      {{- end }}