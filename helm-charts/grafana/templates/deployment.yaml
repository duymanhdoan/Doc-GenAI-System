apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "grafana.fullname" . }}
  namespace: {{ .Values.global.namespace | default "observability" }}
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "grafana.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "grafana.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: grafana
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: GF_SECURITY_ADMIN_USER
          value: {{ .Values.admin.user }}
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: {{ .Values.admin.password }}
        {{- if .Values.config.server }}
        - name: GF_SERVER_ROOT_URL
          value: {{ .Values.config.server.root_url | quote }}
        - name: GF_SERVER_SERVE_FROM_SUB_PATH
          value: {{ .Values.config.server.serve_from_sub_path | quote }}
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        volumeMounts:
        - name: grafana-data
          mountPath: /var/lib/grafana
        - name: datasources-config
          mountPath: /etc/grafana/provisioning/datasources
        - name: dashboards-config
          mountPath: /etc/grafana/provisioning/dashboards
        {{- if .Values.dashboards.enabled }}
        - name: dashboards-files
          mountPath: {{ .Values.dashboards.path }}
        {{- end }}
        {{- if .Values.healthcheck.enabled }}
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: {{ .Values.healthcheck.initialDelaySeconds }}
          periodSeconds: {{ .Values.healthcheck.periodSeconds }}
          timeoutSeconds: {{ .Values.healthcheck.timeoutSeconds }}
          failureThreshold: {{ .Values.healthcheck.failureThreshold }}
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: {{ .Values.healthcheck.initialDelaySeconds }}
          periodSeconds: {{ .Values.healthcheck.periodSeconds }}
          timeoutSeconds: {{ .Values.healthcheck.timeoutSeconds }}
          failureThreshold: {{ .Values.healthcheck.failureThreshold }}
        {{- end }}
      volumes:
      - name: grafana-data
        {{- if .Values.persistence.enabled }}
        persistentVolumeClaim:
          claimName: {{ include "grafana.fullname" . }}-data
        {{- else }}
        emptyDir: {}
        {{- end }}
      - name: datasources-config
        configMap:
          name: {{ include "grafana.fullname" . }}-datasources
      - name: dashboards-config
        configMap:
          name: {{ include "grafana.fullname" . }}-dashboards
      {{- if .Values.dashboards.enabled }}
      - name: dashboards-files
        configMap:
          name: {{ include "grafana.fullname" . }}-dashboard-files
      {{- end }}