apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "cadvisor.fullname" . }}
  namespace: {{ .Values.global.namespace | default .Release.Namespace | default "observability" }}
  labels:
    {{- include "cadvisor.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "cadvisor.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cadvisor.selectorLabels" . | nindent 8 }}
    spec:
      containers:
      - name: cadvisor
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: 8080
          name: http
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        volumeMounts:
        - name: rootfs
          mountPath: /rootfs
          readOnly: true
        - name: var-run
          mountPath: /var/run
        - name: sys
          mountPath: /sys
          readOnly: true
        - name: docker
          mountPath: /var/lib/docker
          readOnly: true
      volumes:
      - name: rootfs
        hostPath:
          path: /
      - name: var-run
        hostPath:
          path: /var/run
      - name: sys
        hostPath:
          path: /sys
      - name: docker
        hostPath:
          path: /var/lib/docker